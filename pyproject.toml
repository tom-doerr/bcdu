[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bcdu"
version = "0.1.0"
description = "A keyboard-first terminal storage explorer for bcachefs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{name = "Tom Doerr"}]
dependencies = ["textual>=7.5,<9"]
classifiers = ["Environment :: Console", "Operating System :: POSIX :: Linux", "Programming Language :: Python :: 3"]

[project.urls]
Homepage = "https://github.com/tom-doerr/bcdu"
Issues = "https://github.com/tom-doerr/bcdu/issues"

[project.scripts]
bcdu = "bcdu.__main__:main"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.9"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
